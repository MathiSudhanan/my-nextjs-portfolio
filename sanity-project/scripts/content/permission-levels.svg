<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif">
<title>Eight permission levels, from most specific to least specific</title>
<rect width="1280" height="800" fill="#0B1221"/>
<text x="80" y="90" fill="#00D9FF" font-size="16" letter-spacing="3" font-family="'IBM Plex Mono',Consolas,monospace">PERMISSION LEVELS</text>
<text x="80" y="124" fill="#94A3B8" font-size="20">Most specific on top. The most specific applicable level wins.</text>
<rect x="490" y="150" width="420" height="60" rx="12" fill="#111827" stroke="#00D9FF" stroke-width="2"/>
<text x="518" y="177" fill="#00D9FF" font-size="22" font-weight="600">User</text>
<text x="518" y="199" fill="#94A3B8" font-size="15">Overrides everything</text>
<rect x="455" y="222" width="490" height="60" rx="12" fill="#111827" stroke="#3B4658" stroke-width="1.5"/>
<text x="483" y="249" fill="#E2E8F0" font-size="22" font-weight="600">User Group</text>
<text x="483" y="271" fill="#94A3B8" font-size="15">Overrides every level below</text>
<rect x="420" y="294" width="560" height="60" rx="12" fill="#111827" stroke="#3B4658" stroke-width="1.5"/>
<text x="448" y="321" fill="#E2E8F0" font-size="22" font-weight="600">Category</text>
<text x="448" y="343" fill="#94A3B8" font-size="15">Country, state, sector</text>
<rect x="385" y="366" width="630" height="60" rx="12" fill="#111827" stroke="#3B4658" stroke-width="1.5"/>
<text x="413" y="393" fill="#E2E8F0" font-size="22" font-weight="600">Stat</text>
<text x="413" y="415" fill="#94A3B8" font-size="15">A specific calculation</text>
<rect x="350" y="438" width="700" height="60" rx="12" fill="#111827" stroke="#3B4658" stroke-width="1.5"/>
<text x="378" y="465" fill="#E2E8F0" font-size="22" font-weight="600">Client Fund</text>
<text x="378" y="487" fill="#94A3B8" font-size="15">Least permissive with Fund</text>
<rect x="315" y="510" width="770" height="60" rx="12" fill="#111827" stroke="#3B4658" stroke-width="1.5"/>
<text x="343" y="537" fill="#E2E8F0" font-size="22" font-weight="600">Fund</text>
<text x="343" y="559" fill="#94A3B8" font-size="15">Takes precedence over Portfolio</text>
<rect x="280" y="582" width="840" height="60" rx="12" fill="#111827" stroke="#3B4658" stroke-width="1.5"/>
<text x="308" y="609" fill="#E2E8F0" font-size="22" font-weight="600">Portfolio</text>
<text x="308" y="631" fill="#94A3B8" font-size="15">A collection of funds</text>
<rect x="245" y="654" width="910" height="60" rx="12" fill="#111827" stroke="#3B4658" stroke-width="1.5"/>
<text x="273" y="681" fill="#E2E8F0" font-size="22" font-weight="600">Base Profile</text>
<text x="273" y="703" fill="#94A3B8" font-size="15">The default permissions</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00D9FF"/></marker></defs>
<path d="M120 684V186" stroke="#00D9FF" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="140" y="432" fill="#94A3B8" font-size="16">Higher</text>
<text x="140" y="454" fill="#94A3B8" font-size="16">precedence</text>
</svg>
